name: Release VSIX

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run package

      - name: Verify tagged package version
        if: github.event_name == 'push'
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v${version}" = "${GITHUB_REF_NAME}"

      - name: Package VSIX
        run: |
          version="$(node -p "require('./package.json').version")"
          npx @vscode/vsce package --no-dependencies --out "azure-pipelines-field-guide-${version}.vsix"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: azure-pipelines-field-guide-vsix
          path: '*.vsix'

      - name: Create GitHub Release and attach VSIX
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" *.vsix \
            --title "Azure Pipelines Field Guide ${GITHUB_REF_NAME}" \
            --generate-notes
